name: CI

# Run once per change: on pull requests, and on pushes to main only. This avoids
# the double-trigger (push AND pull_request) that doubled Actions-minute usage on
# this private repo.
on:
  pull_request:
  push:
    branches: [ main ]

# Cancel an in-flight run when a newer commit arrives on the same ref, so rapid
# pushes don't stack up billed minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python tools/verify_release.py
