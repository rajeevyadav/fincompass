name: Deploy landing page

# Publishes the static site in site/ to GitHub Pages. Enable once under
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "resources/glossary.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Assemble the published site: the landing page plus the client-side
      # browser app under /app (its glossary comes from the single registry).
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r site/* _site/
          cp -r web/* _site/app/
          cp resources/glossary.json _site/app/glossary.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
