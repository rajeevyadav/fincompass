# Pre-commit hooks (FinCompass governance guardrail).
# Install once:  pip install pre-commit && pre-commit install --install-hooks
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=15360']   # allow the synthetic fixtures / model artifact
      - id: check-merge-conflict
      - id: detect-private-key

  # Lint the app Python (exclude vendored assets and the manuscript).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        exclude: ^(static/vendor/|paper/)

  # Secret scanning (repo-wide).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Commit-message structure: <type>(<scope>): <desc>
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: no-ai-trailer
        name: Reject AI/tool co-author or attribution trailers
        entry: .github/hooks/check-no-ai-trailer.sh
        language: script
        stages: [commit-msg]
      - id: no-restricted-files
        name: Block secrets / runtime-data files
        entry: .github/hooks/check-restricted-files.sh
        language: script
        pass_filenames: true
